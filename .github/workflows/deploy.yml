name: Deploy Monorepo (Next + Nest)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependências (raiz do monorepo)
        run: npm ci

      - name: Lint e typecheck dos dois apps
        run: npx turbo run lint typecheck --filter=./apps/web --filter=./apps/api

  deploy-web:
    name: Deploy web (Vercel)
    needs: quality
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependências
        run: npm ci

      - name: Validar acesso ao projeto Vercel
        shell: bash
        run: |
          if [[ ! "$VERCEL_PROJECT_ID" =~ ^prj_ ]] || [[ ! "$VERCEL_ORG_ID" =~ ^(team_|org_) ]]; then
            echo "::error::VERCEL_PROJECT_ID ou VERCEL_ORG_ID possui formato inválido."
            exit 1
          fi

          status="$(
            curl --silent --show-error --output /dev/null --write-out "%{http_code}" +              --header "Authorization: Bearer $VERCEL_TOKEN" +              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID"
          )"

          case "$status" in
            200) echo "Token autorizado para o projeto Vercel." ;;
            401|403)
              echo "::error::VERCEL_TOKEN inválido, expirado ou sem acesso ao time do projeto (HTTP $status)."
              exit 1
              ;;
            404)
              echo "::error::VERCEL_PROJECT_ID não pertence ao VERCEL_ORG_ID informado, ou o token não pode visualizar esse projeto (HTTP 404)."
              exit 1
              ;;
            *)
              echo "::error::A API da Vercel retornou HTTP $status ao consultar o projeto."
              exit 1
              ;;
          esac

      - name: Baixar envs de produção do projeto
        working-directory: apps/web
        run: npx --yes vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build
        working-directory: apps/web
        run: npx --yes vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy
        working-directory: apps/web
        run: npx --yes vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  deploy-api:
    name: Deploy api (Render)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Disparar deploy na Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            echo "::error::O secret RENDER_DEPLOY_HOOK_URL não está configurado."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
