name: mission-atos-local

services:
  postgres-dev:
    image: postgres:18.4
    environment:
      POSTGRES_DB: mission_atos_dev
      POSTGRES_USER: mission_atos_dev
      POSTGRES_PASSWORD: local_dev_only
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mission_atos_dev -d mission_atos_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:18.4
    environment:
      POSTGRES_DB: mission_atos_test
      POSTGRES_USER: mission_atos_test
      POSTGRES_PASSWORD: local_test_only
      TZ: UTC
    ports:
      - "55433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U mission_atos_test -d mission_atos_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-dev-data:
